<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Hosts · headnode</title>
<link rel="stylesheet" href="/vendor/xterm.css">
<link rel="stylesheet" href="/style.css">
<!-- xterm.js and its fit addon (web/vendor/README.md). Scripts with defer run
     in this order, so app.js can rely on them. If the files are missing, the
     requests fail quietly and the Terminal tab says so. -->
<script src="/vendor/xterm.js" defer></script>
<script src="/vendor/addon-fit.js" defer></script>
<script src="/app.js" defer></script>
</head>
<!-- "logged-out" hides the sidebar until app.js knows who is logged in -->
<body class="logged-out">
<div class="app">

  <aside class="sidebar">
    <div class="org">
      <div class="org-mark">HN</div>
      <div class="org-text">
        <div>headnode</div>
        <!-- app.js fills in "0.1.0 · up 3h 12m" -->
        <div class="org-version sub" id="server-line"></div>
      </div>
    </div>
    <!-- app.js fills in the links: Admin pages only show for administrators -->
    <nav class="nav" id="nav"></nav>
    <div class="userbox" id="userbox"></div>
  </aside>

  <main class="main">
    <!-- app.js fills this in. There is no inline script or style anywhere in
         web/, which is what lets the server send a strict
         Content-Security-Policy (server/http.go). -->
    <div class="content" id="view"></div>
  </main>

</div>
</body>
</html>
